openapi: 3.0.3

info:
  title: Availability Planner API
  version: 1.0.0
  description: API for managing users, groups, and weekly availability.

servers:
  - url: http://localhost:8080
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Users
    description: Operations for the signed-in user
  - name: Groups
    description: Group membership operations
  - name: Availability
    description: User availability operations

paths:
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getOwnProfile
      summary: Get the signed-in user's profile
      responses:
        '200':
          description: The signed-in user's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Users]
      operationId: deleteOwnAccount
      summary: Delete the signed-in user's account
      description: Deletes the user's account and related records according to the database foreign-key rules.
      responses:
        '204':
          description: Account deleted successfully. No response body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/groups/{groupId}/members/me:
    delete:
      tags: [Groups]
      operationId: leaveGroup
      summary: Remove the signed-in user from a group
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: The signed-in user was removed from the group.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/availability/{availabilityId}:
    delete:
      tags: [Availability]
      operationId: deleteAvailability
      summary: Delete an availability record
      description: Deletes an availability record belonging to the signed-in user.
      parameters:
        - $ref: '#/components/parameters/AvailabilityId'
      responses:
        '204':
          description: The availability record was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token for the authenticated user.

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      description: The schedule group ID.
      schema:
        type: integer
        format: int64
        example: 1

    AvailabilityId:
      name: availabilityId
      in: path
      required: true
      description: The availability record ID.
      schema:
        type: integer
        format: int64
        example: 42

  schemas:
    User:
      type: object
      required:
        - id
        - displayName
        - role
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 7
        oauthProvider:
          type: string
          nullable: true
          example: google
        oauthSubject:
          type: string
          nullable: true
          example: google-user-subject
        displayName:
          type: string
          example: Cooper Westervelt
        role:
          type: string
          enum:
            - USER
            - ADMIN
          example: USER
        createdAt:
          type: string
          format: date-time
          readOnly: true

    Problem:
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: The requested record was not found.
        instance:
          type: string
          example: /api/v1/availability/42

  responses:
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: The requested record does not exist or is not accessible to the signed-in user.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'