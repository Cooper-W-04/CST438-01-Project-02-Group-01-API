# Docker Compose configuration using Supabase and .env variables
version: '3.8'

services:
  api:
    build: .
    container_name: schedulr_api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SUPABASE_DB_URL}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SUPABASE_DB_PASSWORD}
