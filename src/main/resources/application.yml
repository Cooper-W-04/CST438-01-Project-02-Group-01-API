spring:
  datasource:
    # Replace [YOUR-PROJECT-REF] with your actual Supabase project reference
    url: jdbc:postgresql://db.[YOUR-PROJECT-REF].supabase.co:5432/postgres
    username: postgres
    # Use your Supabase database password (found in Project Settings -> Database)
    password: YOUR_SUPABASE_DB_PASSWORD
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Use 'validate' if your tables are already created in Supabase,
      # or 'update' if you want Hibernate to help manage schema updates.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect