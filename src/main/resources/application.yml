# Database configuration is supplied through environment variables.
# Do not put Supabase credentials directly in this file.

spring:
  datasource:
    url: ${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL}}
    username: ${SUPABASE_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: org.postgresql.Driver